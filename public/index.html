<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Feedback Cloud Application Demo</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>💬 Feedback Cloud Application Demo</h1>
      <p class="lead">ส่งความเห็นหรือคะแนนของคุณ — ข้อมูลจะถูกเก็บลง Cosmos DB</p>
    </header>

    <section class="form-section">
      <form id="feedbackForm" class="feedback-form" autocomplete="off">
        <div class="row">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your name" required />
        </div>

        <div class="row">
          <label for="email">Email (Optional)</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>

        <div class="row">
          <label for="category">Category</label>
          <select id="category">
            <option value="">General</option>
            <option value="bug">Bug</option>
            <option value="feature">Feature</option>
            <option value="support">Support</option>
            <option value="other">Other..</option>
          </select>
        </div>

        <div class="row small-row">
          <label for="rating">Rating</label>
          <select id="rating">
            <option value="">— Select —</option>
            <option value="1">1 ⭐</option>
            <option value="2">2 ⭐⭐</option>
            <option value="3">3 ⭐⭐⭐</option>
            <option value="4">4 ⭐⭐⭐⭐</option>
            <option value="5">5 ⭐⭐⭐⭐⭐</option>
          </select>

          <label class="checkbox-label">
            <input type="checkbox" id="subscribe" />            
             Follow the news
          </label>
        </div>

        <div class="row">
          <label for="message">Message</label>
          <textarea id="message" placeholder="Enter your message...." required></textarea>
          
        </div>

        <div class="row actions">
          <button type="submit" class="btn">Sand Feedback</button>
          <button type="button" id="clearBtn" class="btn ghost" title="ล้างฟอร์ม">Clear</button>
         <!-- <button type="button" id="cancelEditBtn" class="btn ghost" style="display:none;">Cancel Edit</button> -->
        </div>
      </form>
    </section>

    <section class="list-section">
      <h2>📋 All Feedback</h2>

      <!-- Template for a feedback item (script can clone this) -->
      <template id="feedbackItemTemplate">
        <li class="feedback-item" data-id="">
          <div class="item-main">
            <strong class="item-name">Name</strong>
            <span class="item-category">Category</span>
            <p class="item-message">Message</p>
          </div>
          <div class="item-actions">
            <button type="button" class="btn ghost edit-btn" title="Edit">Edit</button>
            <button type="button" class="btn ghost delete-btn" title="Delete">Delete</button>
          </div>
        </li>
      </template>

      <ul id="feedbackList" class="feedback-list"></ul>
    </section>

    <footer class="footer">
      <small>Feedback demo — Cosmos DB</small>
      <small>6610510018 6610510270</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
